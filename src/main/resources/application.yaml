server:
  error:
    include-stacktrace: never

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: bankapi
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update

logging:
  level:
    org:
    hibernate:
      SQL: Debug
      type:
        descriptor:
          sql:
            BasicBinder: TRACE
    orm:
      jdbc:
        bind: WARN